<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten Pribadi - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg: #08080c;
            --bg-elevated: #101018;
            --fg: #f4f4f6;
            --fg-muted: #71717a;
            --accent: #f59e0b;
            --accent-dim: rgba(245, 158, 11, 0.15);
            --card: #14141c;
            --card-hover: #1c1c26;
            --border: #27272f;
            --success: #22c55e;
            --danger: #ef4444;
        }

        [data-theme="light"] {
            --bg: #fafaf9;
            --bg-elevated: #ffffff;
            --fg: #18181b;
            --fg-muted: #71717a;
            --accent: #d97706;
            --accent-dim: rgba(217, 119, 6, 0.1);
            --card: #ffffff;
            --card-hover: #f4f4f5;
            --border: #e4e4e7;
        }

        * { box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .font-display { font-family: 'Space Grotesk', sans-serif; }

        /* Ambient background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-dim) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
        }

        /* Glass card */
        .glass-card {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(245, 158, 11, 0.03) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        [data-theme="light"] .glass-card {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.1) 0%, rgba(217, 119, 6, 0.02) 100%);
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        /* Card base */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.3);
        }

        /* Entrance animations */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                opacity: 1;
                transform: none;
            }
            .reveal.visible { transition: none; }
            .card:hover { transform: none; }
        }

        /* Progress ring */
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-bg { stroke: var(--border); }
        .progress-ring-fill { transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] .btn-ghost {
            background: rgba(0, 0, 0, 0.04);
        }

        [data-theme="light"] .btn-ghost:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* Focus visible */
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Nav item */
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--fg-muted);
            transition: color 0.2s ease, transform 0.15s ease;
            border-radius: 12px;
        }

        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn.active { color: var(--accent); }

        .nav-btn svg { width: 22px; height: 22px; }
        .nav-btn span { font-size: 11px; font-weight: 500; }

        /* Transaction item */
        .tx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .tx-item:hover { background: var(--card-hover); }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>

        };

        // ============ UTILITIES ============
        function formatCurrency(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        }

        function calculateProgress(current, target) {
            return Math.min(100, Math.round((current / target) * 100));
        }

        function getProgressOffset(percent, circumference) {
            return circumference - (percent / 100) * circumference;
        }

        // ============ RENDER FUNCTIONS ============
        function renderLokerCards() {
            const grid = document.getElementById('lokerGrid');
            if (!grid) return;
            
            grid.innerHTML = lokerData.map((loker, index) => {
                const percent = calculateProgress(loker.current, loker.target);
                const radius = 32;
                const circumference = 2 * Math.PI * radius;
                const offset = getProgressOffset(percent, circumference);
                const colorRgba = loker.color.replace('#', '');
                const r = parseInt(colorRgba.substr(0, 2), 16);
                const g = parseInt(colorRgba.substr(2, 2), 16);
                const b = parseInt(colorRgba.substr(4, 2), 16);
                
                return `
                    <div class="card p-4 reveal reveal-delay-${index + 1}" style="--card-accent: ${loker.color};">
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(${r}, ${g}, ${b}, 0.15);">
                                <svg class="w-5 h-5" style="color: ${loker.color};" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    ${icons[loker.icon]}
                                </svg>
                            </div>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full" style="background: rgba(${r}, ${g}, ${b}, 0.15); color: ${loker.color};">${percent}%</span>
                        </div>
                        <h4 class="font-semibold text-sm" style="color: var(--fg);">${loker.name}</h4>
                        <p class="text-xs mt-1" style="color: var(--fg-muted);">Terkumpul</p>
                        <p class="font-display font-bold text-lg mt-0.5" style="color: ${loker.color};">${formatCurrency(loker.current)}</p>
                        <div class="w-full rounded-full h-1.5 mt-3" style="background: var(--border);">
                            <div class="h-1.5 rounded-full transition-all duration-1000" style="width: ${percent}%; background: ${loker.color};"></div>
                        </div>
                        <p class="text-xs mt-1.5" style="color: var(--fg-muted);">Target: ${formatCurrency(loker.target)}</p>
                    </div>
                `;
            }).join('');
        }

        function renderTransactions() {
            const list = document.getElementById('txList');
            if (!list) return;
            
            list.innerHTML = transactionData.map(tx => {
                const isIncome = tx.type === 'income';
                const iconBg = isIncome ? 'rgba(34, 197, 94, 0.12)' : 'rgba(239, 68, 68, 0.12)';
                const iconColor = isIncome ? '#22c55e' : '#ef4444';
                const amountColor = isIncome ? '#22c55e' : '#ef4444';
                const amountSign = isIncome ? '+' : '-';
                
                return `
                    <div class="tx-item">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${iconBg};">
                                <svg class="w-5 h-5" style="color: ${iconColor};" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    ${isIncome 
                                        ? '<path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />'
                                        : '<path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />'
                                    }
                                </svg>
                            </div>
                            <div>
                                <p class="font-medium text-sm">${tx.title}</p>
                                <p class="text-xs" style="color: var(--fg-muted);">${tx.desc}</p>
                            </div>
                        </div>
                        <p class="font-display font-bold text-sm" style="color: ${amountColor};">${amountSign}${formatCurrency(tx.amount)}</p>
                    </div>
                `;
            }).join('');
        }

        // ============ THEME TOGGLE ============
        function initTheme() {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const header = document.querySelector('header');
            const nav = document.querySelector('nav');
            
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            updateGlassElements(savedTheme);
            
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    updateThemeIcon(next);
                    updateGlassElements(next);
                });
            }
            
            function updateThemeIcon(theme) {
                if (!icon) return;
                icon.innerHTML = theme === 'dark'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />'
                    : '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />';
            }
            
            function updateGlassElements(theme) {
                const bgColor = theme === 'dark' ? 'rgba(8, 8, 12, 0.85)' : 'rgba(250, 250, 249, 0.85)';
                if (header) header.style.background = bgColor;
                if (nav) nav.style.background = bgColor;
            }
        }

        // ============ SCROLL REVEAL ============
        function initScrollReveal() {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            if (prefersReducedMotion) {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
                return;
            }
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
            
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // ============ BOTTOM NAV ============
        function initNavigation() {
            const navBtns = document.querySelectorAll('.nav-btn');
            
            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    navBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        }

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', () => {
            renderLokerCards();
            renderTransactions();
            initTheme();
            initScrollReveal();
            initNavigation();
        });
    </script>
</body>
</html>
