<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Loker Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080c; --bg-elevated: #101018; --fg: #f4f4f6; --fg-muted: #71717a;
            --accent: #f59e0b; --accent-dim: rgba(245,158,11,0.12); --card: #14141c;
            --card-hover: #1c1c26; --border: #27272f; --danger: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg);
            min-height: 100vh; padding-bottom: 100px; overflow-x: hidden;
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        /* Atmosfer latar */
        body::before {
            content: ''; position: fixed; top: -40%; left: -20%; width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; bottom: -30%; right: -20%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(139,92,246,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        /* Glass card */
        .glass-card {
            background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.03) 100%);
            backdrop-filter: blur(24px); border: 1px solid rgba(245,158,11,0.2);
        }

        /* Card base */
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { background: var(--card-hover); transform: translateY(-2px); box-shadow: 0 12px 32px -8px rgba(0,0,0,0.3); }

        /* Tombol */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 11px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { box-shadow: 0 8px 28px rgba(245,158,11,0.4); }
        .btn-ghost { background: rgba(255,255,255,0.06); color: var(--fg); border: 1px solid var(--border); }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }

        /* Bottom Nav */
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 8px 16px; color: var(--fg-muted); transition: color 0.2s ease, transform 0.15s ease;
            border-radius: 12px; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif;
        }
        .nav-btn:hover { transform: translateY(-2px); }
        .nav-btn.active { color: var(--accent); }
        .nav-btn svg { width: 22px; height: 22px; }
        .nav-btn span { font-size: 11px; font-weight: 500; }

        /* Reveal anim */
        .reveal {
            opacity: 0; transform: translateY(24px);
        }
        .reveal.visible {
            opacity: 1; transform: translateY(0);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }

        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; }
            .reveal.visible { transition: none; }
            .card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- ========== CEK LOGIN ========== -->
    <script>
        if (!sessionStorage.getItem('lokerActiveUser')) {
            window.location.href = 'login.html';
        }
    </script>

    <!-- ========== HEADER ========== -->
    <header class="sticky top-0 z-50 px-4 py-4 backdrop-blur-xl border-b border-[var(--border)]" style="background: rgba(8,8,12,0.85);">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center">
                    <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3"/></svg>
                </div>
                <div>
                    <h1 class="font-display font-bold text-lg leading-tight">Loker Keuangan</h1>
                    <p class="text-xs" style="color: var(--fg-muted);" id="headerGreeting">Selamat datang!</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="btn btn-ghost text-sm" aria-label="Keluar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
                Keluar
            </button>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="relative z-10 max-w-lg mx-auto px-4 py-6 space-y-6">
        
        <!-- Saldo Card -->
        <section class="reveal">
            <div class="glass-card rounded-2xl p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-40 h-40 opacity-30 pointer-events-none" aria-hidden="true">
                    <svg viewBox="0 0 200 200" class="w-full h-full">
                        <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="0.5" style="color: var(--accent);" opacity="0.4"/>
                        <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="0.5" style="color: var(--accent);" opacity="0.3"/>
                        <circle cx="100" cy="100" r="40" fill="none" stroke="currentColor" stroke-width="0.5" style="color: var(--accent);" opacity="0.2"/>
                    </svg>
                </div>
                <p class="text-sm font-medium" style="color: var(--accent);">Saldo Dompet</p>
                <h2 class="font-display text-4xl font-bold mt-1 tracking-tight">Rp 2.500.000</h2>
                <p class="text-sm mt-1" style="color: var(--fg-muted);">Naik 12% dari bulan lalu</p>
                <div class="flex gap-3 mt-5">
                    <button class="btn btn-primary" onclick="location.href='loker.html'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                        Atur Loker
                    </button>
                    <button class="btn btn-ghost" onclick="location.href='riwayat.html'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        Riwayat
                    </button>
                </div>
            </div>
        </section>

        <!-- Loker Section -->
        <section class="reveal reveal-delay-1">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-display font-semibold text-lg">Loker Keuangan</h3>
                <button onclick="location.href='loker.html'" class="text-sm font-medium transition-colors hover:opacity-80" style="color: var(--accent);">+ Tambah</button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="lokerGrid">
                <!-- Rendered by JS dari halaman loker -->
            </div>
        </section>

        <!-- Quick Actions -->
        <section class="reveal reveal-delay-2">
            <h3 class="font-display font-semibold text-lg mb-4">Aksi Cepat</h3>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="location.href='loker.html'" class="flex flex-col items-center gap-2 p-4 rounded-2xl transition-all hover:scale-105" style="background: var(--card); border: 1px solid var(--border);">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--accent-dim);">
                        <svg class="w-5 h-5" style="color: var(--accent);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    </div>
                    <span class="text-xs font-medium" style="color: var(--fg-muted);">Loker</span>
                </button>
                <button onclick="location.href='riwayat.html'" class="flex flex-col items-center gap-2 p-4 rounded-2xl transition-all hover:scale-105" style="background: var(--card); border: 1px solid var(--border);">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(34,197,94,0.12);">
                        <svg class="w-5 h-5" style="color: var(--success);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <span class="text-xs font-medium" style="color: var(--fg-muted);">Riwayat</span>
                </button>
                <button onclick="location.href='profil.html'" class="flex flex-col items-center gap-2 p-4 rounded-2xl transition-all hover:scale-105" style="background: var(--card); border: 1px solid var(--border);">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(139,92,246,0.12);">
                        <svg class="w-5 h-5" style="color: #8b5cf6;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                    </div>
                    <span class="text-xs font-medium" style="color: var(--fg-muted);">Profil</span>
                </button>
            </div>
        </section>

        <!-- Transaction History -->
        <section class="reveal reveal-delay-3">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-display font-semibold text-lg">Transaksi Terakhir</h3>
                <button onclick="location.href='riwayat.html'" class="text-sm font-medium transition-colors hover:opacity-80" style="color: var(--accent);">Lihat Semua</button>
            </div>
            <div class="card overflow-hidden divide-y" style="border-color: var(--border);" id="txList">
                <!-- Rendered by JS -->
            </div>
        </section>
    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 backdrop-blur-xl border-t" style="background: rgba(8,8,12,0.92); border-color: var(--border);" role="navigation" aria-label="Navigasi utama">
        <div class="max-w-lg mx-auto flex justify-around py-2 px-4">
            <button class="nav-btn active" onclick="location.href='index.html'" aria-label="Beranda" aria-current="page">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
                <span>Beranda</span>
            </button>
            <button class="nav-btn" onclick="location.href='loker.html'" aria-label="Loker">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                <span>Loker</span>
            </button>
            <button class="nav-btn" onclick="location.href='riwayat.html'" aria-label="Riwayat">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Riwayat</span>
            </button>
            <button class="nav-btn" onclick="handleLogout()" aria-label="Keluar">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
                <span>Keluar</span>
            </button>
        </div>
    </nav>

    <!-- ========== SCRIPTS ========== -->
    <script>
        // ===== LOGOUT =====
        function handleLogout() {
            sessionStorage.removeItem('lokerActiveUser');
            window.location.href = 'login.html';
        }

        // ===== PERSONALISASI HEADER =====
        (function() {
            const activeUser = sessionStorage.getItem('lokerActiveUser');
            if (activeUser) {
                const USERS_KEY = 'lokerUsers';
                const KEY_PREFIX = 'u:';
                try {
                    const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
                    const userData = users[activeUser];
                    if (userData && userData.displayName) {
                        const greetingEl = document.getElementById('headerGreeting');
                        if (greetingEl) {
                            greetingEl.textContent = 'Selamat datang, ' + userData.displayName + '!';
                        }
                    }
                } catch(e) {
                    console.warn('Gagal membaca data pengguna:', e);
                }
            }
        })();

        /* ========== TEMPAT UNTUK SCRIPT UTAMA (REUSABLE) ========== */
        // Salin semua fungsi render utama dari halaman loker, riwayat, dan profil ke sini.
        // Misalnya: renderLokerCards(), renderTransactions(), dll.
    </script>
</body>
                    </html>
