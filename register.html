<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Loker Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080c; --bg-elevated: #101018; --fg: #f4f4f6; --fg-muted: #71717a;
            --accent: #f59e0b; --accent-dim: rgba(245,158,11,0.12); --card: #14141c;
            --border: #27272f; --danger: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden; position: relative;
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        body::before {
            content: ''; position: fixed; top: -40%; left: -20%; width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; bottom: -30%; right: -20%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        .auth-card {
            position: relative; z-index: 1; width: 100%; max-width: 420px;
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 28px; margin: 20px;
            animation: slideUp 0.5s cubic-bezier(.22,.68,0,1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .input-group { margin-bottom: 18px; }
        .input-label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--fg-muted); margin-bottom: 6px;
        }
        .input-field {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card);
            color: var(--fg); font-size: 15px; font-family: 'DM Sans', sans-serif;
            outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .input-field::placeholder { color: var(--fg-muted); }
        .input-field[aria-invalid="true"] { border-color: var(--danger); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px; border-radius: 12px; font-weight: 700;
            font-size: 15px; border: none; cursor: pointer; transition: all 0.2s ease;
            font-family: 'DM Sans', sans-serif;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 28px rgba(245,158,11,0.4); }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg-elevated); color: var(--fg); }

        .error-msg {
            color: var(--danger); font-size: 13px; margin-top: 6px;
            display: none; align-items: center; gap: 5px;
        }
        .error-msg.show { display: flex; animation: fadeSlideUp 0.3s ease; }

        .avatar-option {
            font-size: 28px; padding: 6px; border-radius: 10px; cursor: pointer;
            transition: all 0.2s ease; border: 2px solid transparent;
            background: transparent; line-height: 1;
        }
        .avatar-option:hover { background: var(--accent-dim); }
        .avatar-option.selected {
            border-color: var(--accent); background: var(--accent-dim);
            transform: scale(1.1);
        }
        .avatar-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .strength-bar {
            height: 3px; border-radius: 999px; background: var(--border);
            margin-top: 8px; overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 999px;
            transition: width 0.3s ease, background 0.3s ease; width: 0%;
        }
        .strength-label {
            font-size: 11px; margin-top: 4px; font-weight: 600;
            transition: color 0.3s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000; border-radius: 50%;
            animation: spin 0.7s linear infinite; flex-shrink: 0;
        }

        /* Toggle show/hide password */
        .pass-wrapper { position: relative; }
        .pass-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 4px;
            color: var(--fg-muted); transition: color 0.2s ease; display: flex;
            align-items: center; justify-content: center;
        }
        .pass-toggle:hover { color: var(--fg); }
        .pass-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        .pass-wrapper .input-field { padding-right: 44px; }

        .link-accent {
            color: var(--accent); font-weight: 600; text-decoration: none;
            transition: opacity 0.2s ease;
        }
        .link-accent:hover { opacity: 0.8; text-decoration: underline; }

        @media (max-width: 480px) {
            .auth-card { padding: 30px 20px; border-radius: 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card" role="main">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center mx-auto mb-4" aria-hidden="true">
                <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3"/>
                </svg>
            </div>
            <h1 class="font-display font-bold text-xl">Loker Keuangan</h1>
            <p class="text-sm mt-1" style="color:var(--fg-muted);">Buat akun baru</p>
        </div>

        <!-- Form -->
        <form id="registerForm" novalidate>

            <!-- Nama -->
            <div class="input-group">
                <label class="input-label" for="regName">Nama Pengguna</label>
                <input
                    type="text" class="input-field" id="regName"
                    placeholder="Huruf, angka, spasi (2–24 karakter)"
                    maxlength="24" autocomplete="off"
                    aria-describedby="nameError" aria-required="true">
                <p class="error-msg" id="nameError" role="alert" aria-live="polite">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                    <span id="nameErrorText"></span>
                </p>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label class="input-label" for="regPassword">Kata Sandi</label>
                <div class="pass-wrapper">
                    <input
                        type="password" class="input-field" id="regPassword"
                        placeholder="Minimal 4 karakter"
                        maxlength="64" autocomplete="new-password"
                        aria-describedby="passError passStrengthLabel" aria-required="true">
                    <button type="button" class="pass-toggle" id="togglePass" aria-label="Tampilkan kata sandi">
                        <svg id="eyeOpen" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <svg id="eyeClosed" class="w-5 h-5" style="display:none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kekuatan kata sandi" id="strengthBar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <p class="strength-label" id="passStrengthLabel" style="color:var(--fg-muted);">—</p>
                <p class="error-msg" id="passError" role="alert" aria-live="polite">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                    <span id="passErrorText"></span>
                </p>
            </div>

            <!-- Konfirmasi Password -->
            <div class="input-group">
                <label class="input-label" for="regConfirm">Konfirmasi Kata Sandi</label>
                <div class="pass-wrapper">
                    <input
                        type="password" class="input-field" id="regConfirm"
                        placeholder="Ulangi kata sandi"
                        maxlength="64" autocomplete="new-password"
                        aria-describedby="confirmError" aria-required="true">
                    <button type="button" class="pass-toggle" id="toggleConfirm" aria-label="Tampilkan konfirmasi kata sandi">
                        <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <svg class="eye-closed w-5 h-5" style="display:none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                        </svg>
                    </button>
                </div>
                <p class="error-msg" id="confirmError" role="alert" aria-live="polite">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                    <span id="confirmErrorText"></span>
                </p>
            </div>

            <!-- Avatar Picker -->
            <div class="input-group">
                <label class="input-label" id="avatarLabel">Pilih Avatar</label>
                <div class="flex flex-wrap gap-2" id="avatarPicker" role="radiogroup" aria-labelledby="avatarLabel"></div>
            </div>

            <!-- Error umum -->
            <p class="error-msg" id="generalError" role="alert" aria-live="assertive" style="margin-bottom: 12px;">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                <span id="generalErrorText"></span>
            </p>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary mt-2" id="submitBtn">
                Buat Akun
            </button>
        </form>

        <!-- Link ke Login -->
        <p class="text-center text-sm mt-6" style="color:var(--fg-muted);">
            Sudah punya akun?
            <a href="login.html" class="link-accent">Masuk di sini</a>
        </p>

        <!-- Kembali — pakai button, bukan <a> dengan class btn -->
        <button type="button" class="btn btn-ghost mt-4" onclick="location.href='index.html'">
            Kembali ke Beranda
        </button>
    </div>

    <script>
        /* =====================================================
           KONSTANTA
        ===================================================== */
        const AVATARS   = ['😀','😎','🤓','🧑‍💻','👩‍💻','🦊','🐱','🐶','🦁','🐼','🦄','🐸','🌟','🔥','💎','🍀','🎯','🎨','🚀','🧩'];
        const USERS_KEY = 'lokerUsers';
        const KEY_PREFIX = 'u:';

        let selectedAvatar = '😀';

        /* =====================================================
           PBKDF2 HASHING — salted, slow, jauh lebih aman
           dari SHA-256 langsung untuk keperluan password
        ===================================================== */
        async function hashPassword(password, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']
            );
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: encoder.encode(salt), iterations: 100000, hash: 'SHA-256' },
                keyMaterial, 256
            );
            return Array.from(new Uint8Array(bits))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        /* =====================================================
           SANITIZASI
        ===================================================== */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /* =====================================================
           STORAGE — dengan try/catch
        ===================================================== */
        function loadUsers() {
            try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
            catch { return {}; }
        }

        function saveUsers(users) {
            try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); return true; }
            catch { return false; }
        }

        /* =====================================================
           CEK USER — Object.hasOwn + prefix anti pollution
        ===================================================== */
        function userExists(users, normalizedName) {
            return Object.hasOwn(users, KEY_PREFIX + normalizedName);
        }

        /* =====================================================
           VALIDASI NAMA — regex Unicode, spasi dikontrol
        ===================================================== */
        const NAME_REGEX = /^[\p{L}\p{N} ]{2,24}$/u;

        function validateName(name) {
            if (!name || name.length < 2)  return 'Nama minimal 2 karakter';
            if (name.length > 24)          return 'Nama maksimal 24 karakter';
            if (!NAME_REGEX.test(name))    return 'Nama hanya boleh berisi huruf, angka, dan spasi';
            if (/^\s|\s$/.test(name))      return 'Nama tidak boleh diawali atau diakhiri spasi';
            return null;
        }

        /* =====================================================
           NORMALISASI NAMA
           - lowercase untuk perbandingan case-insensitive
           - collapse multiple spaces → satu spasi
           - trim leading/trailing
           Mencegah "Admin  User" vs "Admin User" duplikat
        ===================================================== */
        function normalizeName(raw) {
            return raw.toLowerCase().replace(/\s+/g, ' ').trim();
        }

        /* =====================================================
           PASSWORD STRENGTH INDICATOR
        ===================================================== */
        function calcStrength(pass) {
            if (!pass) return { score: 0, label: '—', color: 'var(--fg-muted)' };
            let score = 0;
            if (pass.length >= 4)  score += 20;
            if (pass.length >= 8)  score += 20;
            if (pass.length >= 12) score += 20;
            if (/[A-Z]/.test(pass) && /[a-z]/.test(pass)) score += 20;
            if (/[0-9]/.test(pass)) score += 10;
            if (/[^A-Za-z0-9]/.test(pass)) score += 10;
            score = Math.min(score, 100);

            if (score < 30) return { score, label: 'Lemah',       color: '#ef4444' };
            if (score < 60) return { score, label: 'Cukup',       color: '#f97316' };
            if (score < 80) return { score, label: 'Kuat',        color: '#f59e0b' };
            return             { score, label: 'Sangat Kuat',  color: '#22c55e' };
        }

        function updateStrength(value) {
            const { score, label, color } = calcStrength(value);
            const fill = document.getElementById('strengthFill');
            const lbl  = document.getElementById('passStrengthLabel');
            const bar  = document.getElementById('strengthBar');
            fill.style.width      = score + '%';
            fill.style.background = color;
            lbl.textContent       = value ? label : '—';
            lbl.style.color       = value ? color : 'var(--fg-muted)';
            bar.setAttribute('aria-valuenow', score);
        }

        /* =====================================================
           TOGGLE SHOW/HIDE PASSWORD
           — dipasang pada kedua field password
        ===================================================== */
        function setupPasswordToggle(toggleId, inputId) {
            const toggleBtn = document.getElementById(toggleId);
            const input     = document.getElementById(inputId);

            toggleBtn.addEventListener('click', function() {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                // Tampilkan/sembunyikan ikon yang sesuai
                const openIcon   = this.querySelector('.eye-open');
                const closedIcon = this.querySelector('.eye-closed');
                if (openIcon)   openIcon.style.display   = isPassword ? 'none' : 'block';
                if (closedIcon) closedIcon.style.display = isPassword ? 'block' : 'none';

                // Update aria-label
                this.setAttribute('aria-label',
                    isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'
                );

                // Fokuskan kembali ke input
                input.focus();
            });
        }

        /* =====================================================
           AVATAR PICKER — event delegation
           Tidak ada inline onclick — aman dari XSS
        ===================================================== */
        function renderAvatarPicker() {
            const container = document.getElementById('avatarPicker');
            container.innerHTML = AVATARS.map(a => `
                <button type="button"
                    class="avatar-option ${a === selectedAvatar ? 'selected' : ''}"
                    data-avatar="${a}"
                    aria-label="Avatar ${a}"
                    aria-checked="${a === selectedAvatar}"
                    role="radio">${a}</button>
            `).join('');
        }

        // Klik avatar — event delegation pada container
        document.getElementById('avatarPicker').addEventListener('click', function(e) {
            const btn = e.target.closest('[data-avatar]');
            if (!btn) return;
            selectedAvatar = btn.dataset.avatar;
            renderAvatarPicker();
        });

        // Arrow-key navigation dalam radiogroup
        document.getElementById('avatarPicker').addEventListener('keydown', function(e) {
            const btns = [...this.querySelectorAll('[data-avatar]')];
            const idx  = btns.indexOf(document.activeElement);
            if (idx < 0) return;

            let next = -1;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                next = (idx + 1) % btns.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                next = (idx - 1 + btns.length) % btns.length;
            }

            if (next >= 0) {
                e.preventDefault();
                btns[next].focus();
                btns[next].click();
            }
        });

        /* =====================================================
           ERROR HELPERS — semua error text dinamis
        ===================================================== */
        function showFieldError(id, msg) {
            const el = document.getElementById(id);
            if (!el) return;

            // Set teks error ke span yang sesuai
            const textEl = document.getElementById(id + 'Text');
            if (textEl) textEl.textContent = msg;

            // Set aria-invalid pada input yang terkait
            const inputMap = {
                nameError: 'regName',
                passError: 'regPassword',
                confirmError: 'regConfirm'
            };
            if (inputMap[id]) {
                document.getElementById(inputMap[id]).setAttribute('aria-invalid', 'true');
            }

            el.classList.add('show');
        }

        function clearAllErrors() {
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.input-field').forEach(el => el.removeAttribute('aria-invalid'));
        }

        function showGeneralError(msg) {
            document.getElementById('generalErrorText').textContent = msg;
            document.getElementById('generalError').classList.add('show');
        }

        /* =====================================================
           SUBMIT STATE
        ===================================================== */
        function setLoading(isLoading) {
            const btn = document.getElementById('submitBtn');
            if (isLoading) {
                btn.disabled  = true;
                btn.innerHTML = '<span class="spinner"></span> Memproses...';
            } else {
                btn.disabled  = false;
                btn.innerHTML = 'Buat Akun';
            }
        }

        /* =====================================================
           HANDLE REGISTER — async, PBKDF2, tanpa finally block
        ===================================================== */
        async function handleRegister(e) {
            e.preventDefault();
            clearAllErrors();

            const rawName = document.getElementById('regName').value.trim();
            const pass    = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            // --- Validasi nama ---
            const nameErr = validateName(rawName);
            if (nameErr) {
                showFieldError('nameError', nameErr);
                document.getElementById('regName').focus();
                return;
            }

            // --- Validasi password ---
            if (pass.length < 4) {
                showFieldError('passError', 'Kata sandi minimal 4 karakter');
                document.getElementById('regPassword').focus();
                return;
            }

            // --- Validasi konfirmasi ---
            if (!confirm) {
                showFieldError('confirmError', 'Konfirmasi kata sandi wajib diisi');
                document.getElementById('regConfirm').focus();
                return;
            }
            if (pass !== confirm) {
                showFieldError('confirmError', 'Kata sandi tidak cocok');
                document.getElementById('regConfirm').focus();
                return;
            }

            setLoading(true);

            try {
                const users = loadUsers();

                // Normalisasi: case-insensitive + collapse multi-space + trim
                const normalizedName = normalizeName(rawName);

                // Cek duplikat — Object.hasOwn + prefix
                if (userExists(users, normalizedName)) {
                    showFieldError('nameError', 'Nama sudah digunakan. Silakan pilih nama lain.');
                    document.getElementById('regName').focus();
                    setLoading(false);
                    return;
                }

                // Hash dengan PBKDF2 + random salt
                const salt  = crypto.randomUUID();
                const hash  = await hashPassword(pass, salt);

                users[KEY_PREFIX + normalizedName] = {
                    displayName: rawName,
                    password:    hash,
                    salt:        salt,
                    avatar:      selectedAvatar,
                    joinDate:    Date.now()
                };

                if (!saveUsers(users)) {
                    showGeneralError('Gagal menyimpan data. Penyimpanan mungkin penuh.');
                    setLoading(false);
                    return;
                }

                // Simpan sesi aktif
                sessionStorage.setItem('lokerActiveUser', KEY_PREFIX + normalizedName);

                // Redirect — tidak perlu setLoading(false), page akan pergi
                window.location.href = 'index.html';

            } catch (err) {
                showGeneralError('Terjadi kesalahan: ' + err.message);
                setLoading(false);
            }
        }

        /* =====================================================
           INISIALISASI
        ===================================================== */
        document.addEventListener('DOMContentLoaded', function() {
            renderAvatarPicker();
            setupPasswordToggle('togglePass', 'regPassword');
            setupPasswordToggle('toggleConfirm', 'regConfirm');

            // Pasang listener form — bukan inline onsubmit di HTML
            document.getElementById('registerForm').addEventListener('submit', handleRegister);

            // Listener strength indicator
            document.getElementById('regPassword').addEventListener('input', function() {
                updateStrength(this.value);
            });
        });
    </script>
</body>
</html>
